<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D5B4C" />
      <stop offset="50%" stop-color="#703F32" />
      <stop offset="100%" stop-color="#3D1D16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="45%" stop-color="#E5C383" />
      <stop offset="100%" stop-color="#B88A44" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer luxury squircle with terracotta gradient -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Subtle inner border -->
  <rect x="9" y="9" width="82" height="82" rx="21" fill="none" stroke="#FFF3D6" stroke-opacity="0.25" stroke-width="1" />
  
  <!-- Monogram M in luxury serif typography -->
  <text x="50" y="66" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">M</text>
  
  <!-- 4-point beauty sparkle top right -->
  <path d="M74 16 C74 21.5 78.5 26 84 26 C78.5 26 74 30.5 74 36 C74 30.5 69.5 26 64 26 C69.5 26 74 21.5 74 16 Z" fill="#FFF8EB" filter="url(#glow)" />
  <circle cx="74" cy="26" r="1.5" fill="#FFFFFF" />

  <!-- Tiny sparkle bottom left -->
  <path d="M24 72 C24 75 26.5 77.5 29.5 77.5 C26.5 77.5 24 80 24 83 C24 80 21.5 77.5 18.5 77.5 C21.5 77.5 24 75 24 72 Z" fill="#E5C383" opacity="0.85" />
</svg>
