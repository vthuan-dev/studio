<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&amp;display=swap');
      .fav-letter {
        font-family: 'Bodoni Moda', 'Didot', 'Playfair Display', 'Times New Roman', serif;
        font-size: 58px;
        font-weight: 700;
        fill: #2C2420;
      }
    </style>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="#FAF7F2" stroke="#E5DCD0" stroke-width="2" />
  <!-- Inner soft ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#8D5B4C" stroke-width="1.5" stroke-opacity="0.3" />
  <!-- Lettermark M matching reference -->
  <text x="50" y="70" class="fav-letter" text-anchor="middle">M</text>
  <!-- Tiny warm terracotta dot -->
  <circle cx="78" cy="26" r="3.5" fill="#8D5B4C" />
</svg>